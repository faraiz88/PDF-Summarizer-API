services:

  api:
    build: .
    container_name: pdf_api

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis
      - postgres

    volumes:
      - .:/app


  worker:
    build: .
    container_name: pdf_worker

    command: celery -A app.celery_worker worker --pool=solo --loglevel=info

    env_file:
      - .env

    depends_on:
      - redis
      - postgres

    volumes:
      - .:/app


  redis:
    image: redis:7
    container_name: pdf_redis


  postgres:
    image: postgres:16
    container_name: pdf_postgres

    restart: always

    environment:
      POSTGRES_USER: faraiz
      POSTGRES_PASSWORD: 2202
      POSTGRES_DB: pdf_summarizer

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: